<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2347c5">
<title>Podcast Player</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:light dark;--bg:#edf0f4;--fg:#121821;--mu:#5b6676;--ln:#dbe0e7;--ac:#2347c5;--on:#fff;--bt:#fff;--ok:#1d7a4c}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e8edf3;--mu:#97a3b3;--ln:#28313d;--ac:#8fa6ff;--on:#0d1117;--bt:#1c232d;--ok:#5cc58e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 system-ui,-apple-system,sans-serif}
.drive{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 12px;max-width:720px;margin:0 auto}
.hd{display:flex;align-items:flex-start;gap:6px}.hd>div{flex:1;min-width:0}
.ct{flex:0 0 auto;width:40px;height:40px;margin:-6px -6px 0 0;border-radius:12px;font-size:18px;font-weight:400;background:transparent;box-shadow:none;color:var(--mu);opacity:.7}
.ct.ok{color:var(--ok);opacity:1}
.hd h1{font-size:17px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hd p{margin:2px 0 0;color:var(--mu);font-size:14px}
input[type=range]{width:100%;height:34px;margin:0;accent-color:var(--ac)}
.time{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--mu);font-variant-numeric:tabular-nums;margin-top:-6px}
.time b{color:var(--fg);font-size:17px}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.5fr 1fr 1fr 1fr 1fr;gap:10px;min-height:480px}
button{font:inherit;border:0;background:var(--bt);color:var(--fg);border-radius:18px;font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 1px 2px rgba(0,0,0,.08);-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:active{filter:brightness(.85);transform:scale(.97)}
#play{grid-column:1/-1;background:var(--ac);color:var(--on);font-size:60px}
#prev,#next{font-size:46px}
.spd{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.spd span{font-size:44px}.spd small{font-size:15px;font-weight:600;color:var(--mu)}
.st{text-align:center;font-size:14px;font-weight:600;color:var(--ok);min-height:20px}
.cp{width:100%;min-height:64px;font-size:21px}.cp.ok{background:var(--ac);color:var(--on)}
.fn{width:100%;min-height:72px;font-size:23px;color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.st.err{color:#b23a24}
.hint{text-align:center;color:var(--mu);font-size:13px;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
ol{list-style:none;margin:0 auto;padding:0 12px 28px;max-width:720px}
li{padding:10px 0 10px 4px;border-bottom:1px solid var(--ln);cursor:pointer;display:flex;align-items:center;gap:8px}
li .lt{flex:1;min-width:0}
li .mv{flex:0 0 auto;width:46px;height:46px;border-radius:12px;font-size:20px;box-shadow:none;background:var(--bg);border:1px solid var(--ln)}
li .mv:disabled{opacity:.3}
li.cur{color:var(--ac);font-weight:600}
li small{display:block;color:var(--mu);font-weight:400}
li.fin .lt span{text-decoration:line-through;color:var(--mu)}li.fin .lt span::before{content:"✓ "}
.sumbox{background:var(--bt);border-radius:18px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sumhd{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ac);margin-bottom:6px}
.sumtx{font-size:19px;line-height:1.45;max-height:34vh;overflow-y:auto;-webkit-user-select:text;user-select:text}
.sumbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sumbar button{font-size:19px;min-height:60px;border-radius:14px;background:var(--bg);box-shadow:inset 0 0 0 2px var(--ac);color:var(--ac)}
.sumbar button.one{grid-column:1/-1}
.drive.sum .grid{min-height:300px;grid-template-rows:1.3fr 1fr 1fr 1fr}.drive.sum #b150,.drive.sum #f150{display:none}
.drive.sum #back,.drive.sum #fwd,.drive.sum #b150,.drive.sum #f150{font-size:24px}
li .tag{display:inline-block;font-size:12px;font-weight:700;color:var(--ac);margin-left:4px}
.empty{margin:auto;text-align:center;color:var(--mu);max-width:32ch;font-size:15px}
</style>
</head>
<body>
<div class="drive" id="drive">
  <div class="hd"><div><h1 id="t">No episodes yet</h1><p id="s"></p></div><button id="ct" class="ct" aria-label="Copy episode title">⧉</button></div>
  <input id="seek" type="range" min="0" max="1" step="1" value="0" aria-label="Position">
  <div class="time"><span id="pos">0:00</span><b id="rt">1×</b><span id="len">0:00</span></div>
  <div class="sumbox" id="sumbox" hidden>
    <div class="sumhd" id="sumhd">Summary</div>
    <div class="sumtx" id="sumtx" aria-live="polite"></div>
    <div class="sumbar"><button id="full">▶ Full episode</button><button id="here" class="one">Play from here</button><button id="wo" class="one" hidden>＋ Add original to Daily news</button></div>
  </div>
  <div class="grid">
    <button id="play" aria-label="Play or pause">▶</button>
    <button id="back">−30s</button><button id="fwd">+30s</button>
    <button id="b150">−2:30</button><button id="f150">+2:30</button>
    <button id="prev" aria-label="Previous episode">⏮</button><button id="next" aria-label="Next episode">⏭</button>
    <button id="slow" class="spd"><span>−</span><small>slower</small></button><button id="fast" class="spd"><span>+</span><small>faster</small></button>
  </div>
  <div class="st" id="st" aria-live="polite"></div>
  <button id="fn" class="fn">✓ Finished · next episode</button>
  <div id="cp" class="hint" hidden></div>
  <div class="hint" id="hint">Scroll down for the episode list; use ↑ ↓ there to change the order. Tap ▶ Play all in your queue to load a fresh list.</div>
</div>
<ol id="list"></ol>
<audio id="au" preload="metadata"></audio>
<script type="module">
// The episode list arrives in the link's #fragment (never sent to any server) and is kept on this phone.
const $ = id => document.getElementById(id), au = $('au');
const R = [1, 1.25, 1.5, 1.75, 2, 2.5, 3];
const ls = { get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
             set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let hashOrderAt = 0;
const unb64 = t => Uint8Array.from(atob(t.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const toItems = arr => arr.map(x => ({ id: x[0], t: x[1], s: x[2], a: x[3], d: x[4] || 0, p: x[5] || '', v: x[6] || '', sm: Array.isArray(x[7]) && x[7].length ? x[7] : null })).filter(x => x.a || x.sm);
// Lists with read-aloud summaries arrive deflated (#z=); unpack them into the plain form before the page starts.
const zm = location.hash.match(/[#&]z=([A-Za-z0-9_-]+)/);
let zItems = null;
if (zm) { try { const txt = await new Response(new Blob([unb64(zm[1])]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text(); zItems = toItems(JSON.parse(txt)); } catch (e) { zItems = null; } }
function fromHash(){
  const m = location.hash.match(/[#&]q=([A-Za-z0-9_-]+)/); if (!m && !zm) return null;
  const o = location.hash.match(/[#&]o=(\d+)/); hashOrderAt = o ? +o[1] : 0;
  const lf = location.hash.match(/[#&]f=([A-Za-z0-9_-]+)/), le = location.hash.match(/[#&]e=(\d+)/);
  if (lf && le) ls.set('pp-loop', { f: lf[1], e: le[1] }); else if (location.hash.match(/[#&]f=0(&|$)/)) ls.set('pp-loop', null);

}
// Keeps the slots the known episodes occupy, but fills them in the given order; new episodes keep their place.
function slotMerge(list, ids){
  const pos = new Map(ids.map((id, n) => [id, n]));
  const known = list.filter(q => pos.has(q.id)).sort((a, b) => pos.get(a.id) - pos.get(b.id));

}
let Q = fromHash();
const freshList = !!Q;
if (Q) {
  const po = ls.get('pp-order', null);
  if (po && po.ids && po.at > hashOrderAt) Q = slotMerge(Q, po.ids);
  else ls.set('pp-order', { ids: Q.map(q => q.id), at: hashOrderAt });
  ls.set('pp-queue', Q); history.replaceState(null, '', location.pathname);
}
else Q = ls.get('pp-queue', []);
let pastEnd = 0, rate = +ls.get('pp-rate', 1) || 1, H = new Set(ls.get('pp-heard', [])), i = 0, startAt = 0, lastSave = 0, lastGood = 0, tries = 0, wantPlay = false, retryTimer = null;
// Every episode remembers its own place, so skipping around never loses where you were in any of them.
let P = ls.get('pp-posmap', {});
const WO = new Set(ls.get('pp-wo', []));
const savedPos = ls.get('pp-pos', null);
if (savedPos && savedPos.id && P[savedPos.id] == null) P[savedPos.id] = savedPos.t || 0;
const resumeAt = q => (q && q.id && !H.has(q.id) && P[q.id]) || 0;
if (freshList) {
  // A new Play all starts at the top of the queue: the first episode not yet finished, in queue order.
  const k = Q.findIndex(q => !(q.id && H.has(q.id)));
  i = k >= 0 ? k : 0; startAt = resumeAt(Q[i]);
} else if (savedPos) {
  // Reopened from the home screen: pick up the episode that was playing.
  const k = Q.findIndex(q => q.id === savedPos.id); if (k >= 0) { i = k; startAt = resumeAt(Q[k]) || savedPos.t || 0; }
}
// Release date of an episode, e.g. "Nov 3" (the year is added when it is not the current one).
const rel = q => { const d = new Date(q && q.p); if (!q || !q.p || isNaN(d)) return ''; return d.toLocaleDateString([], d.getFullYear() === new Date().getFullYear() ? { month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric', year: 'numeric' }); };
const sub = (q, k) => q.s + (rel(q) ? ' · ' + rel(q) : '') + ' · ' + (k + 1) + ' of ' + Q.length;
const f = s => { s = Math.floor(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0'); return h ? h + ':' + String(m).padStart(2, '0') + ':' + x : m + ':' + x; };
const mine = () => Q.filter(q => q.id && H.has(q.id)).map(q => q.id);
function savePos(){
  const q = Q[i]; if (!q) return;
  const t = au.currentTime || lastGood || startAt || 0;
  ls.set('pp-pos', { id: q.id, t });
  if (q.id && t > 0) {
    delete P[q.id]; P[q.id] = t;
    const ks = Object.keys(P); if (ks.length > 300) ks.slice(0, ks.length - 300).forEach(x => delete P[x]);

  }
}
// Drop box: each finished episode id is posted to a Google Form (no sign-in needed); the Listening Queue
// reads the form's sheet and removes those episodes itself. Unsent ids wait in an outbox and retry.
const loop = () => ls.get('pp-loop', null);
function outboxAdd(id){ const ob = ls.get('pp-outbox', []); if (!ob.includes(id)) ob.push(id); ls.set('pp-outbox', ob.slice(-200)); flush(); }
let flushing = false;
async function flush(){
  const cfg = loop(); if (!cfg || flushing || !navigator.onLine) return;
  flushing = true;
  try {
    let ob = ls.get('pp-outbox', []);
    while (ob.length) {
      const id = ob[0];
      const body = new URLSearchParams(); body.set('entry.' + cfg.e, id);
      await fetch('https://docs.google.com/forms/d/e/' + cfg.f + '/formResponse', { method: 'POST', mode: 'no-cors', body, keepalive: true });
      ob = ob.slice(1); ls.set('pp-outbox', ob);
    }
  } catch (e) {} finally { flushing = false; mark(); }
}
addEventListener('online', flush);
function heard(){ const q = Q[i]; if (!q || !q.id || H.has(q.id)) return; delete P[q.id]; ls.set('pp-posmap', P); H.add(q.id); ls.set('pp-heard', [...H].slice(-400)); if (!WO.has(q.id)) outboxAdd(q.id); mark(); }
function mark(){
  $('rt').textContent = inSum ? 'voice ' + vrate.toFixed(1) + '×' : rate + '×';
  [...$('list').children].forEach((li, k) => { li.classList.toggle('cur', k === i); li.classList.toggle('fin', H.has(Q[k].id)); });
  const q = Q[i]; $('st').textContent = q && H.has(q.id) ? '✓ Finished' : '';
  const ob = ls.get('pp-outbox', []), cfg = loop();
  $('cp').hidden = !(cfg && ob.length); $('cp').textContent = ob.length + ' finished, waiting to sync to your queue';
}
function setRate(r){ rate = r; au.playbackRate = r; ls.set('pp-rate', r); mark(); }
// Summaries have their own reading speed (0.5x to 2x). A change picks up from the last word spoken, not the paragraph start.
let vrate = +ls.get('pp-vrate', 0.9) || 0.9, sumChar = 0;
function setVRate(r){ vrate = Math.round(Math.max(0.5, Math.min(2, r)) * 10) / 10; ls.set('pp-vrate', vrate); mark(); if (inSum && speaking) speakPara(sumK, sumChar); }
const sk = n => { const d = au.duration || 1e9; au.currentTime = Math.max(0, Math.min(d - 1, au.currentTime + n)); };
function load(k, go, t){
  i = k; const q = Q[i]; if (!q) return;
  stopSum();
  if (useSummary(q)) { enterSum(go); return; }
  $('drive').classList.remove('sum'); $('sumbox').hidden = true; labels(false);
  if (!q.a) { $('st').textContent = ''; $('t').textContent = q.t; $('s').textContent = sub(q, i); mark(); return; }
  if (t == null) t = resumeAt(q);
  clearTimeout(retryTimer); tries = 0; pastEnd = 0; wantPlay = !!go; lastGood = t || 0; $('st').classList.remove('err');
  startAt = t || 0; au.src = q.a; au.playbackRate = rate;
  $('t').textContent = q.t; $('s').textContent = sub(q, i);
  $('seek').value = 0; $('pos').textContent = f(startAt); $('len').textContent = q.d ? f(q.d) : '0:00';
  if ('mediaSession' in navigator) { try { navigator.mediaSession.metadata = new MediaMetadata({ title: q.t, artist: q.s, artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }] }); } catch (e) {} }
  mark(); savePos();
  if (go) au.play().catch(() => { $('play').textContent = '▶'; });
}
$('ct').onclick = async () => {
  const q = Q[i]; if (!q) return; let ok = false;
  try { await navigator.clipboard.writeText(q.t); ok = true; } catch (e) {}
  if (!ok) { const ta = document.createElement('textarea'); ta.value = q.t; document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); }
  $('ct').textContent = ok ? '✓' : '!'; $('ct').classList.toggle('ok', ok); setTimeout(() => { $('ct').textContent = '⧉'; $('ct').classList.remove('ok'); }, 1200);
};
$('slow').onclick = () => inSum ? setVRate(vrate - 0.1) : setRate(R.filter(x => x < rate).pop() || R[0]);
$('fast').onclick = () => inSum ? setVRate(vrate + 0.1) : setRate(R.find(x => x > rate) || R[R.length - 1]);
function broken(){ return !!au.error || au.networkState === 3 || !au.currentSrc; }
// Reload the same episode at the last good position (audio links can expire while paused, or the signal drops).
function recover(){
  const q = Q[i]; if (!q) return;
  startAt = lastGood || au.currentTime || startAt || 0;
  au.removeAttribute('src'); au.load(); au.src = q.a; au.playbackRate = rate;
  if (wantPlay) au.play().catch(() => {});
}
let pausedAt = 0, kickTimer = null;
function playNow(){
  if (!Q.length) return; wantPlay = true;
  // After a long pause Android may have frozen the page or the stream link may be stale, so reload at the saved spot.
  const stale = pausedAt && Date.now() - pausedAt > 90000;
  if (broken() || stale) { tries = 0; $('st').classList.remove('err'); $('st').textContent = 'Reconnecting…'; pausedAt = 0; recover(); kick(); return; }
  au.play().catch(() => { if (broken()) recover(); });
  kick();
}
// If play was requested but nothing is actually playing a few seconds later, reload once and try again.
function kick(){
  clearTimeout(kickTimer);
  kickTimer = setTimeout(() => {
    if (wantPlay && au.paused === false && au.readyState >= 3 && au.currentTime !== lastT) return;
    if (wantPlay && (au.paused || au.readyState < 3)) { recover(); }
  }, 6000);
}
$('play').onclick = () => { if (!Q.length) return; if (inSum) { speaking ? pauseSum() : resumeSum(); return; } au.paused ? playNow() : (wantPlay = false, au.pause()); };
function finishNext(){
  const q = Q[i]; if (!q) return;
  if (q.id && !H.has(q.id)) { H.add(q.id); ls.set('pp-heard', [...H].slice(-400)); if (!WO.has(q.id)) outboxAdd(q.id); }
  let k = i + 1; while (k < Q.length && H.has(Q[k].id)) k++;
  if (k < Q.length) { load(k, true); window.scrollTo(0, 0); }
  else { au.pause(); mark(); $('st').textContent = 'All done. Every episode in this list is finished.'; }
}
$('fn').onclick = finishNext;
$('prev').onclick = () => { if (i > 0) { load(i - 1, true); return; } const q = Q[i]; if (q && sumOf(q)) { sumMode[q.id] = 0; ls.set('pp-sum', sumMode); } load(i, true, 0); };  // on the first item, start it over
$('next').onclick = () => { if (i < Q.length - 1) load(i + 1, true); };
$('back').onclick = () => inSum ? jumpPara(-1) : sk(-30); $('b150').onclick = () => inSum ? jumpPara(-3) : sk(-150); $('fwd').onclick = () => inSum ? jumpPara(1) : sk(30); $('f150').onclick = () => inSum ? jumpPara(3) : sk(150);
$('seek').oninput = e => { if (inSum) { sumK = +e.target.value; saveSum(); showPara(); if (speaking) speakPara(sumK); return; } au.currentTime = +e.target.value; };
au.onplay = () => { au.playbackRate = rate; $('play').textContent = '❚❚'; if ('mediaSession' in navigator) try { navigator.mediaSession.playbackState = 'playing'; } catch (e) {} };

// Moving on at the end: 'ended' is the normal signal, but streams with inserted ads often break off
// in the last moments (an error or a stall instead of 'ended'), so those count as the end too.
let advancing = false, lastT = -1, stuckSince = 0;
function nearEnd(){ const d = au.duration || (Q[i] && Q[i].d) || 0; const t = au.currentTime || lastGood || 0; return d > 0 && t > 0 && d - t < Math.max(45, d * 0.02); }
function advance(){
  if (advancing) return; advancing = true; setTimeout(() => { advancing = false; }, 2500);
  clearTimeout(retryTimer); heard();
  if (i < Q.length - 1) {
    load(i + 1, true);
    au.play().catch(() => { $('st').textContent = 'Tap ▶ to start the next episode.'; });
  } else { wantPlay = false; $('st').textContent = 'All done. Every episode in this list is finished.'; }
}
au.onended = advance;
// Safety net: still "playing" but stuck in the last stretch for 8+ seconds means the stream ended without saying so.
setInterval(() => {
  if (!wantPlay || au.paused || !Q[i]) { stuckSince = 0; lastT = -1; return; }
  const t = au.currentTime;
  if (t !== lastT) { lastT = t; stuckSince = Date.now(); return; }
  if (nearEnd() && stuckSince && Date.now() - stuckSince > 8000) advance();
}, 2000);
au.onerror = () => {
  if (!Q[i] || !au.getAttribute('src')) return;
  if (wantPlay && nearEnd()) { advance(); return; }
  if (tries < 3) { tries++; $('st').classList.remove('err'); $('st').textContent = 'Reconnecting…'; clearTimeout(retryTimer); retryTimer = setTimeout(recover, 1500 * tries); return; }
  $('st').classList.add('err'); $('st').textContent = 'This episode would not load. Tap ▶ to try again, or ⏭ to skip it.';
};
au.onloadedmetadata = () => { au.playbackRate = rate; if (startAt && startAt < (au.duration || 0) - 5) au.currentTime = startAt; startAt = 0; $('seek').max = Math.floor(au.duration || 0); $('len').textContent = f(au.duration); };
au.ontimeupdate = () => {
  $('seek').value = Math.floor(au.currentTime); $('pos').textContent = f(au.currentTime); if (au.currentTime > 0) lastGood = au.currentTime;
  // Finished = heard the last 10% by actually listening: the player must have been past 90% for
  // 3 seconds of natural playback, so a +2:30 tap that lands near the end does not cross it off.
  if (au.duration && au.currentTime >= au.duration * 0.9) { if (!pastEnd) pastEnd = Date.now(); else if (Date.now() - pastEnd > 3000) heard(); }
  else pastEnd = 0;
  if (Date.now() - lastSave > 5000) { lastSave = Date.now(); savePos(); }
};
au.onseeking = () => { pastEnd = 0; };
document.addEventListener('visibilitychange', () => { if (document.hidden) savePos(); else { syncSession(); flush(); } });
flush();
if ('mediaSession' in navigator) { try { const m = navigator.mediaSession;
  m.setActionHandler('play', () => inSum ? resumeSum() : playNow()); m.setActionHandler('pause', () => { if (inSum) { pauseSum(); return; } wantPlay = false; au.pause(); });
  m.setActionHandler('nexttrack', () => $('next').onclick()); m.setActionHandler('previoustrack', () => $('prev').onclick());
  m.setActionHandler('seekforward', () => inSum ? jumpPara(1) : sk(30)); m.setActionHandler('seekbackward', () => inSum ? jumpPara(-1) : sk(-30));
  try { m.setActionHandler('seekto', d => { if (d && d.seekTime != null) au.currentTime = d.seekTime; }); } catch (e) {} } catch (e) {} }
function syncSession(){ if (!('mediaSession' in navigator)) return; try {
